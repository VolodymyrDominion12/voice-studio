# Мапінг імен голосів, які надсилає застосунок, на реальні голоси рушія.
# Ідея запозичена з voice_to_speaker.yaml у matatonic/openedai-speech.
#
# Ліва частина — ім'я у запиті до /v1/audio/speech.
# Права — реальний голос і типова просода.
#
# Це дає змогу застосунку надсилати звичні імена (alloy/nova/…) і не знати,
# який рушій за ними стоїть. Заміна Speaches на інший шлюз не ламає UI.

voices:
  # ── OpenAI-сумісні псевдоніми → українські голоси ──────────────────────
  alloy:
    voice: uk_UA-tetiana-high
    speed: 1.00
    note: "жіночий, нейтральний — рекомендований за замовчуванням"
  nova:
    voice: uk_UA-lada-x_low
    speed: 1.05
    note: "жіночий, швидший; x_low — найлегша модель"
  onyx:
    voice: uk_UA-mykyta-high
    speed: 0.95
    note: "чоловічий, повільніший — годиться для нон-фікшн"
  echo:
    voice: uk_UA-oleksa-high
    speed: 1.00
    note: "чоловічий"
  fable:
    voice: uk_UA-ukrainian_tts-medium
    speed: 1.00
    note: "3 спікери в одній моделі"

  # ── Прямі імена для явного вибору в UI ────────────────────────────────
  uk-tetiana: { voice: uk_UA-tetiana-high }
  uk-mykyta:  { voice: uk_UA-mykyta-high }
  uk-oleksa:  { voice: uk_UA-oleksa-high }
  uk-lada:    { voice: uk_UA-lada-x_low }

# Типові параметри генерації. Для Piper це length_scale (темп) і
# noise_scale/noise_w (варіативність). length_scale задає темп НАТИВНО,
# без DSP-артефактів — саме тому він основа шару виразу (ADR-004).
piper_defaults:
  length_scale: 1.0    # >1 = повільніше, <1 = швидше
  noise_scale: 0.667   # варіативність інтонації
  noise_w: 0.8         # варіативність тривалості
