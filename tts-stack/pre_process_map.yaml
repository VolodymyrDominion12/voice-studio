# Виправлення вимови: regex → заміна.
# Патерн запозичено з pre_process_map.yaml у matatonic/openedai-speech.
#
# НАВІЩО: жодна TTS-модель не читає латиницю, символи й абревіатури так, як
# треба. Цей файл дає точку контролю без правки коду — можна додати виняток
# за секунду, почувши помилку.
#
# ПОРЯДОК ВАЖЛИВИЙ: правила застосовуються зверху вниз. Довші шаблони — вище,
# щоб коротше правило не зіпсувало їх.
#
# Повні правила нормалізації (числа, дати, символи) живуть у коді
# (app/services/normalize/uk.py) — тут лише винятки й точкові виправлення.

rules:
  # ── Латиниця та абревіатури ────────────────────────────────────────────
  - pattern: '\bIT\b'
    replace: 'ай-ті'
  - pattern: '\bAPI\b'
    replace: 'ей-пі-ай'
  - pattern: '\bPDF\b'
    replace: 'пі-ді-еф'
  - pattern: '\bHTML\b'
    replace: 'ейч-ті-ем-ел'
  - pattern: '\bCEO\b'
    replace: 'сі-і-оу'
  - pattern: '\bAI\b'
    replace: 'ей-ай'
  - pattern: '\bML\b'
    replace: 'ем-ел'

  # ── Символи ────────────────────────────────────────────────────────────
  - pattern: '(\d+)\s*%'
    replace: '\1 відсотків'
  - pattern: '№\s*(\d+)'
    replace: 'номер \1'
  - pattern: '§\s*(\d+)'
    replace: 'параграф \1'
  - pattern: '→|->'
    replace: 'далі'
  - pattern: '&'
    replace: 'і'

  # ── Українська типографіка ─────────────────────────────────────────────
  # Тире в діалозі — це пауза, а не слово. Прибираємо, паузу додає
  # шар виразу через pause_before_ms.
  - pattern: '^\s*[—–]\s*'
    replace: ''
  - pattern: '«|»'
    replace: ''
  # Нерозривний пробіл і тонкий пробіл — рушії на них спотикаються
  - pattern: '[\u00a0\u202f\u2009]'
    replace: ' '

  # ── Точкові виправлення наголосу ───────────────────────────────────────
  # ukrainian-tts має автоматичний наголос, Piper — ні. Для слів, які Piper
  # читає з неправильним наголосом, можна вписати наголошений варіант
  # (акут U+0301 після голосної).
  # Приклади — шаблони, розкоментувати й замінити на реальні знахідки
  # після прослуховування (див. PLAN.md, «Що виміряти, а не вгадати», п.4):
  #
  # - pattern: '\bзамок\b'
  #   replace: 'за́мок'
  # - pattern: '\bсторінки\b'
  #   replace: 'сторінки́'
